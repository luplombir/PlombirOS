<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plombir OS</title>
<style>
:root{--ink:#241f3a;--mut:#6b6684;--glass:rgba(255,255,255,.82);--line:rgba(36,31,58,.15);--field:rgba(255,255,255,.7);--acc:#5b3df5;--onacc:#fff;--wall:linear-gradient(135deg,#ffd7c2,#e3c9ff 50%,#bfe3ff);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--ink:#f1eefc;--mut:#a9a3c4;--glass:rgba(34,30,56,.88);--line:rgba(255,255,255,.14);--field:rgba(255,255,255,.08);--acc:#9a85ff;--onacc:#161230;--wall:linear-gradient(135deg,#2a1b3d,#1b2a4a 60%,#14303a);color-scheme:dark}}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;background:var(--wall) center/cover}
#desk{flex:1;position:relative;overflow:hidden}
.win{position:absolute;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(30,20,70,.28);resize:both;overflow:hidden;min-width:230px;min-height:150px;max-width:calc(100% - 8px)}
.win.min{display:none}
.tb{display:flex;align-items:center;gap:7px;padding:11px 14px;cursor:grab;touch-action:none;user-select:none}
.tb i{flex:1;text-align:center;font-style:normal;font-weight:800;margin-right:36px}
.tb button{width:15px;height:15px;border-radius:50%;border:0;padding:0;cursor:pointer}
.tb .x{background:#ff6b6b}.tb .m{background:#ffc857}
.bd{flex:1;overflow:auto;padding:4px 14px 14px;display:flex;flex-direction:column;gap:9px}
input{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font:inherit}
select,select option{background:#14121f;color:#fff}select{border:1px solid var(--line);border-radius:10px;padding:5px 8px;font:inherit}
.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:12px;padding:9px 16px;font:inherit;font-weight:800;cursor:pointer}
.sm{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:3px 9px;font:inherit;font-size:13px;cursor:pointer}
.row{display:flex;gap:7px}.row input{flex:1;min-width:0}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:9px}.msg .b{background:var(--field);border-radius:4px 14px 14px 14px;padding:6px 11px}.msg small{color:var(--mut);margin-left:6px}
.sys{align-self:center;text-align:center;color:var(--mut);font-size:13px;background:var(--field);border-radius:10px;padding:4px 10px}.sys small{margin-left:6px}
.av{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#161230;flex:none}
.per{display:flex;align-items:center;gap:9px}.st{margin-left:auto;color:var(--mut);font-size:13px}.st.on{color:#1f9d55;font-weight:600}
.tag{background:var(--acc);color:var(--onacc);border-radius:8px;padding:0 7px;font-size:12px;font-weight:600}
.mut{color:var(--mut)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#bar{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--glass);backdrop-filter:blur(18px);border-top:1px solid var(--line);position:relative;z-index:9998}
#start{background:var(--acc);color:var(--onacc);border:0;border-radius:12px;padding:8px 16px;font:inherit;font-weight:800;cursor:pointer}
#tasks{flex:1;display:flex;gap:6px;overflow-x:auto;min-width:0}
.tk{background:none;border:1px solid transparent;color:var(--ink);padding:6px 12px;border-radius:12px;font:inherit;cursor:pointer;white-space:nowrap}.tk.on{border-color:var(--acc);background:var(--field)}
#menu{position:absolute;left:8px;bottom:54px;width:210px;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:6px;display:none;box-shadow:0 14px 40px rgba(30,20,70,.3)}
#menu.open{display:block}#menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:10px 12px;border-radius:12px;font:inherit;cursor:pointer}#menu button:hover{background:var(--field)}
.lo{background:none;border:0;color:var(--ink);font:inherit;cursor:pointer;text-decoration:underline}
@media(max-width:520px){#who{display:none}}
#auth{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:16px;background:var(--wall) center/cover}#auth.hide{display:none}
#card{width:min(360px,100%);background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:11px;box-shadow:0 20px 60px rgba(30,20,70,.3)}
#card h1{margin:0;font-size:30px;letter-spacing:-.02em}
.tabs{display:flex;background:var(--field);border-radius:12px;padding:3px}.tabs button{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-weight:600;padding:7px;border-radius:10px;cursor:pointer}.tabs button.on{background:var(--acc);color:var(--onacc)}
#err{color:#d6336c;min-height:20px;font-size:13px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10000;background:var(--acc);color:var(--onacc);padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 24px)}
</style>
</head>
<body>
<div id="auth"><form id="card">
 <h1>Plombir OS</h1>
 <div class="tabs"><button type="button" id="t-in" class="on">Log in</button><button type="button" id="t-up">Sign up</button></div>
 <input id="un" placeholder="Username" autocomplete="username" aria-label="Username" required>
 <input id="pw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password" required>
 <div id="err" role="alert"></div><button class="btn" id="go">Log in</button>
</form></div>
<div id="desk"></div>
<div id="bar"><div id="menu"></div><button id="start">Plombir OS</button><div id="tasks"></div><span id="who"></span><button class="lo" id="out">Log out</button></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let me=null,ws,people=[],hist=[],ulist=[],wins={},z=10,n=0,mode="in",pend=null;
const post=async(p,b)=>(await fetch("/api/"+p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})})).json();
const toast=t=>{const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),5000)};
const tm=ts=>new Date(ts).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
const isStaff=()=>me&&me.role!=="User",tx=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
const av=(nm,c)=>`<div class="av" style="background:${/^#[0-9a-f]{6}$/i.test(c)?c:"#b8c0ff"}">${esc((nm[0]||"?").toUpperCase())}</div>`;
const live=v=>v===-1||v>Date.now();

const apps={
 chat:{t:"Global chat",w:360,h:420,build(b,w){
  b.innerHTML=`<div class="msgs"></div><div class="row"><input maxlength="500" placeholder="Say something…" aria-label="Message"><button class="btn">Send</button></div>`;
  const box=b.querySelector(".msgs"),inp=b.querySelector("input");
  w.draw=()=>{box.innerHTML=hist.map(x=>x.sys?`<div class="sys">${esc(x.text)}<small>${tm(x.ts)}</small></div>`:`<div class="msg">${av(x.name,x.color)}<div class="b"><b>${esc(x.name)}</b><small>${tm(x.ts)}</small><div>${esc(x.text)}</div></div></div>`).join("");box.scrollTop=box.scrollHeight};
  const send=()=>{const m=inp.value.trim();if(m){tx({t:"chat",m});inp.value=""}};
  b.querySelector(".btn").onclick=send;inp.onkeydown=e=>{if(e.key==="Enter")send()};w.draw()}},
 people:{t:"People online",w:280,h:320,build(b,w){
  w.draw=()=>{b.innerHTML=people.map(p=>`<div class="per">${av(p.name,p.color)}<span>${esc(p.name)}</span>${p.role!=="User"?`<span class="tag">${esc(p.role)}</span>`:""}<span class="st ${p.online?"on":""}">${p.online?"online":"offline"}</span></div>`).join("")};w.draw()}},
 admin:{t:"Admin panel",staff:1,w:420,h:480,build(b,w){
  tx({t:"users"});
  w.draw=()=>{
   const f=pend?`<div class="msg"><div class="b" style="flex:1;display:grid;gap:6px"><b>${pend.a==="ban"?"Ban":"Mute"} ${esc(pend.name)}</b><select id="du">${[["10m","10 minutes"],["1h","1 hour"],["1d","1 day"],["7d","7 days"],["perm","Permanently"]].map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select><input id="rn" maxlength="80" placeholder="Reason (shown in chat)" aria-label="Reason"><div class="row"><button class="btn" id="ok">Confirm</button><button class="sm" id="no">Cancel</button></div></div></div>`:"";
   b.innerHTML=f+ulist.map(u=>{const mt=live(u.mute_until),bn=live(u.ban_until),can=u.id!==me.id&&(me.role==="Admin"||u.role==="User"),bt=(a,l)=>`<button class="sm" data-a="${a}" data-i="${u.id}" data-n="${esc(u.name)}">${l}</button>`;
    return `<div class="per" style="align-items:flex-start"><div style="flex:1"><b>${esc(u.name)}</b> <span class="tag">${esc(u.role)}</span>${bn?` <span class="tag" style="background:#d6336c;color:#fff">Banned</span>`:""}${mt?` <span class="tag" style="background:#e08a00;color:#fff">Muted</span>`:""}<div class="row" style="flex-wrap:wrap;margin-top:4px">${me.role==="Admin"&&u.id!==me.id?`<select data-r="${u.id}" aria-label="Role for ${esc(u.name)}">${["User","Moderator","Admin"].map(r=>`<option${r===u.role?" selected":""}>${r}</option>`).join("")}</select>`:""}${can?bt(mt?"unmute":"mute",mt?"Unmute":"Mute")+bt(bn?"unban":"ban",bn?"Unban":"Ban"):""}</div></div></div>`}).join("");
   b.querySelectorAll("[data-a]").forEach(x=>x.onclick=()=>{const a=x.dataset.a;if(a==="mute"||a==="ban"){pend={a,id:+x.dataset.i,name:x.dataset.n};w.draw()}else tx({t:"mod",action:a,id:+x.dataset.i})});
   b.querySelectorAll("[data-r]").forEach(x=>x.onchange=()=>tx({t:"mod",action:"role",id:+x.dataset.r,role:x.value}));
   const ok=b.querySelector("#ok");if(ok){ok.onclick=()=>{tx({t:"mod",action:pend.a,id:pend.id,dur:b.querySelector("#du").value,reason:b.querySelector("#rn").value});pend=null};b.querySelector("#no").onclick=()=>{pend=null;w.draw()}}};
  w.draw()}}
};
const paint=()=>Object.values(wins).forEach(w=>w.tk.classList.toggle("on",!w.el.classList.contains("min")&&+w.el.style.zIndex===z));
const redraw=()=>Object.values(wins).forEach(w=>w.draw&&w.draw());
function open(id){
 if(wins[id]){wins[id].el.classList.remove("min");wins[id].el.style.zIndex=++z;paint();return}
 const a=apps[id],el=document.createElement("div"),w={el},sm=innerWidth<520;
 el.className="win";el.style.cssText=`width:${Math.min(a.w,innerWidth-16)}px;height:${Math.min(a.h,innerHeight-120)}px;left:${sm?8:24+n*32}px;top:${sm?8:18+n*28}px;z-index:${++z}`;n=(n+1)%7;
 el.innerHTML=`<div class="tb"><button class="x" aria-label="Close"></button><button class="m" aria-label="Minimize"></button><i>${a.t}</i></div><div class="bd"></div>`;$("#desk").append(el);
 const tk=document.createElement("button");tk.className="tk";tk.textContent=a.t;$("#tasks").append(tk);w.tk=tk;wins[id]=w;a.build(el.querySelector(".bd"),w);
 tk.onclick=()=>{if(el.classList.contains("min")||+el.style.zIndex!==z){el.classList.remove("min");el.style.zIndex=++z}else el.classList.add("min");paint()};
 el.querySelector(".x").onclick=()=>{el.remove();tk.remove();delete wins[id];paint()};el.querySelector(".m").onclick=()=>{el.classList.add("min");paint()};
 el.onpointerdown=()=>{el.style.zIndex=++z;paint()};
 const tb=el.querySelector(".tb");tb.onpointerdown=e=>{if(e.target.closest("button"))return;const r=el.getBoundingClientRect(),d=$("#desk").getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;tb.setPointerCapture(e.pointerId);
  tb.onpointermove=m=>{el.style.left=Math.max(0,Math.min(m.clientX-dx-d.left,d.width-80))+"px";el.style.top=Math.max(0,Math.min(m.clientY-dy-d.top,d.height-44))+"px"};tb.onpointerup=()=>tb.onpointermove=null};
 paint()}

function connect(){
 ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");
 ws.onmessage=e=>{const d=JSON.parse(e.data);
  if(d.t==="hello"){hist=d.history;redraw();if(isStaff()&&wins.admin)tx({t:"users"})}
  else if(d.t==="msg"){hist.push(d.m);hist=hist.slice(-100);redraw()}
  else if(d.t==="people"){people=d.list;redraw()}
  else if(d.t==="users"){ulist=d.list;redraw()}
  else if(d.t==="refresh"){if(isStaff()&&wins.admin)tx({t:"users"})}
  else if(d.t==="err")toast(d.m)};
 ws.onclose=e=>{if(!me)return;if(e.code===4001){me=null;show(true);toast("You were signed out. If you were banned, the login screen shows why.")}else setTimeout(connect,2000)}}
function show(login){$("#auth").classList.toggle("hide",!login);if(login)Object.keys(wins).forEach(k=>{wins[k].el.remove();wins[k].tk.remove();delete wins[k]})}
async function start(){
 const r=await fetch("/api/me");if(!r.ok)return show(true);me=await r.json();show(false);
 $("#who").textContent=me.name+" · "+me.role;
 $("#menu").innerHTML=Object.entries(apps).filter(([k,a])=>!a.staff||isStaff()).map(([k,a])=>`<button data-k="${k}">${a.t}</button>`).join("");
 connect();open("chat");open("people")}
const setMode=m=>{mode=m;$("#t-in").classList.toggle("on",m==="in");$("#t-up").classList.toggle("on",m==="up");$("#go").textContent=m==="in"?"Log in":"Create account";$("#err").textContent=""};
$("#t-in").onclick=()=>setMode("in");$("#t-up").onclick=()=>setMode("up");
$("#card").onsubmit=async e=>{e.preventDefault();const r=await post(mode==="in"?"login":"signup",{name:$("#un").value.trim(),pw:$("#pw").value});
 if(r.error){$("#err").textContent=r.error;return}$("#pw").value="";start()};
$("#out").onclick=async()=>{await post("logout");me=null;if(ws)ws.close();show(true)};
$("#start").onclick=e=>{e.stopPropagation();$("#menu").classList.toggle("open")};
$("#menu").onclick=e=>{const k=e.target.dataset.k;if(k){$("#menu").classList.remove("open");open(k)}};
document.addEventListener("pointerdown",e=>{if(!$("#menu").contains(e.target)&&e.target.id!=="start")$("#menu").classList.remove("open")});
start();
</script>
</body>
</html>
